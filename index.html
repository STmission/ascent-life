<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="浮生 Ascent：从出身走到死亡的人生晋升游戏。可在浏览器玩，也可打包上架 Steam。" />
    <title>浮生 Ascent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231b1714'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' fill='%238f2d2a'%3E生%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <canvas id="view" aria-label="浮生的三维场景"></canvas>
    <div id="fade"></div>
    <div id="ui">
      <div id="screen"></div>
      <div id="hud" class="hidden"></div>
      <div id="modal" class="hidden" role="dialog" aria-modal="true"></div>
      <div id="toasts" aria-live="polite"></div>
    </div>
    <p id="prompt"></p>
    <p id="hint">↑ W 前进 · ↓ S 后退 · ← A 向左 · → D 向右 · 拖动鼠标或 Q R 转身 · E 查看 · Shift 快走</p>
    <div id="touch">
      <div id="stick" aria-label="移动摇杆"><div id="knob"></div></div>
      <button id="act" type="button">查看</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
